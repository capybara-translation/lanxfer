name: Check

on:
  push:
    branches: [main]
  pull_request:

# These jobs only read the repository. Declaring it here keeps GITHUB_TOKEN
# read-only regardless of the repository's default workflow permissions.
permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed on:"; echo "$files"; exit 1
          fi

      - run: go vet ./...
      # -race instruments memory access to catch unsynchronized goroutine
      # access at runtime; discovery and recv run goroutines.
      - run: go test -race ./...

  goreleaser-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Builds every target exactly as a release would, without publishing.
      # Catches cross-compile breakage (e.g. Windows-only errors) before a tag.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  # The desktop app in gui/ is a separate Go module, so the jobs above do not
  # cover it. macOS is a supported platform and runs the frontend checks too.
  # Each job ends by running gui/scripts/build-release.sh, the script the
  # release workflow uses, with a dummy tag, so a change that breaks the
  # release build is caught here and not on the day of a release. The tag
  # differs from the placeholders in the tracked files, so the checks in
  # stamp-version.sh fail if the version did not land. Nothing is uploaded.
  gui-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Latest patch release, as in the release workflow.
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true
          cache-dependency-path: gui/go.sum

      # Satisfies the engines of vite in gui/frontend/package.json
      # (^20.19.0 || >=22.12.0).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - run: npm ci
        working-directory: gui/frontend

      # The generated bindings are not tracked; the frontend imports them.
      - run: wails3 generate bindings -clean=true -ts -i
        working-directory: gui

      - run: npm run build
        working-directory: gui/frontend

      - run: npm run check
        working-directory: gui/frontend

      - run: go vet ./...
        working-directory: gui

      - run: go test ./...
        working-directory: gui

      - name: Build the release app
        run: gui/scripts/build-release.sh macos v9.9.9 "$RUNNER_TEMP/dist"

      # The tap only receives a final tag, so a broken cask would otherwise
      # surface on release day. brew style reports a file outside a Casks
      # directory, and it misses an unknown stanza, which loading the cask
      # catches.
      - name: Check the cask
        run: |
          sha256=$(shasum -a 256 "$RUNNER_TEMP/dist/lanxfer-app_darwin_universal.zip" | cut -d' ' -f1)
          cask="$RUNNER_TEMP/tap/Casks/lanxfer-app.rb"
          mkdir -p "$(dirname "$cask")"
          gui/scripts/render-cask.sh v9.9.9 "$sha256" "$cask"
          brew style "$cask"
          brew ruby -e 'Cask::CaskLoader::FromContentLoader.new(File.read(ARGV.first)).load(config: nil)' "$cask"

  # Linux is not tested by hand; this job is the only thing that compiles it.
  gui-ubuntu:
    # Pinned: the package names below are those of Ubuntu 24.04, whose GTK 4
    # is new enough for the Wails Linux backend.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          check-latest: true
          cache-dependency-path: gui/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      # Wails v3.0.0 builds against GTK 4 and WebKitGTK 6.0 on Linux.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - run: go vet ./...
        working-directory: gui

      - run: go build ./...
        working-directory: gui

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Build the release apps
        run: |
          gui/scripts/build-release.sh windows v9.9.9 "$RUNNER_TEMP/dist"
          gui/scripts/build-release.sh linux v9.9.9 "$RUNNER_TEMP/dist"
